version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Verificando versiones de Node.js..."
      - node -v
      - npm -v
      - echo "Instalando dependencias del proyecto..."
      - npm install

  pre_build:
    commands:
      - echo "Preparando para build..."

  build:
    commands:
      - echo "Construyendo proyecto Astro..."
      - npm run build
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_ID --paths "/*"

artifacts:
  files:
    - '**/*'
  base-directory: dist