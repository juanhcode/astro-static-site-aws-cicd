version: 0.2

phases:
  install:
    commands:
      - echo "Instalando Node 22 directamente..."
      # Habilitar NodeSource repo para Node 22
      - curl -fsSL https://rpm.nodesource.com/setup_22.x | sudo bash -
      - sudo yum install -y nodejs
      - node -v
      - npm -v
      - echo "Instalando dependencias del proyecto..."
      - npm install

  pre_build:
    commands:
      - echo "Preparando para build..."

  build:
    commands:
      - echo "Construyendo proyecto Astro..."
      - npm run build

artifacts:
  files:
    - '**/*'
  base-directory: dist